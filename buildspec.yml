version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - AWS_ACCOUNT_ID=407178840191
      - AWS_REGION=us-east-2
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/linkbridge
      - IMAGE_TAG=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-$CODEBUILD_BUILD_NUMBER}" | cut -c 1-7)
      - echo "Repository: $REPOSITORY_URI"
      - echo "Image tag: $IMAGE_TAG"
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REPOSITORY_URI

  build:
    commands:
      - echo "Building Docker image..."
      - 'docker build -t $REPOSITORY_URI:$IMAGE_TAG .'
      - 'docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:latest'

  post_build:
    commands:
      - echo "Pushing Docker image..."
      - 'docker push $REPOSITORY_URI:$IMAGE_TAG'
      - 'docker push $REPOSITORY_URI:latest'
      - echo "Creating ECS deployment artifact..."
      - |
          printf '[{"name":"linkbridge-web","imageUri":"%s"}]' "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json
      - echo "Generated imagedefinitions.json:"
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json