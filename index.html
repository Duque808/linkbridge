<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LinkBridge</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="app">

    <!-- Header -->
    <header class="header">

      <div class="brand">
        <div class="brand-icon">🔗</div>

        <div>
          <h1>LinkBridge</h1>
          <span>Connect • Communicate • Resolve</span>
        </div>
      </div>

      <div class="user-profile">
        <div class="user-avatar">A</div>

        <div class="user-info">
          <strong>Andre</strong>
          <span class="online-status">
            <span class="status-dot"></span>
            Online
          </span>
        </div>
      </div>

    </header>


    <!-- Main Application -->
    <main class="main">

      <!-- Conversation Sidebar -->
      <aside class="sidebar">

        <div class="sidebar-header">
          <h2>Conversations</h2>

          <button
            class="new-conversation"
            id="newConversationButton"
            title="New conversation"
          >
            +
          </button>
        </div>


        <div class="conversation-list" id="conversationList">

          <!-- Conversations are generated by JavaScript -->

        </div>

      </aside>


      <!-- Chat Area -->
      <section class="chat">

        <!-- Chat Header -->
        <div class="chat-header">

          <div>
            <h2 id="chatName">John Smith</h2>

            <span class="chat-status">
              <span class="status-dot"></span>
              <span id="chatStatus">Online</span>
            </span>
          </div>

        </div>


        <!-- Messages -->
        <div
          class="messages"
          id="messages"
        >
          <!-- Messages are generated by JavaScript -->
        </div>


        <!-- Message Composer -->
        <div class="composer">

          <textarea
            id="messageInput"
            placeholder="Type a message..."
            rows="1"
          ></textarea>

          <button
            id="sendButton"
            class="send-button"
          >
            Send
          </button>

        </div>

      </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

      <span>
        LinkBridge v1.0
      </span>

      <span>
        AWS ECS • Automated Deployment
      </span>

    </footer>

  </div>


  <script src="app.js"></script>

</body>
</html>
